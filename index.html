<script>
(function () {

  async function open(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
                                            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html, pw) {
    try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  var f = document.getElementById('f'), b = document.getElementById('b'), msg = document.getElementById('msg');
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot open the page. Please use Google Chrome or Microsoft Edge.'; b.disabled = true; return; }
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}

               .catch(function () { try { sessionStorage.removeItem(KEY); } catch (e) {} b.disabled = false; msg.textContent = ''; }); }
  f.addEventListener('submit', function (ev) {
